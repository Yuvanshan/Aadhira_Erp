<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mahdev ERP - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at top, #4a7fd4, #2a55a8 55%, #1a3480);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
    }

    .splash-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 25px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0 20px;
    }

    p.status {
      color: #d0e4ff;
      opacity: 0.9;
    }

    p.warning {
      color: #fbbf24;
      opacity: 1;
      font-weight: 500;
    }

    p.error {
      color: #f87171;
      opacity: 1;
      font-weight: 500;
    }

    .loader {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
      margin: auto;
    }

    .loader span {
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #22c55e, #3b82f6);
      border-radius: 10px;
      animation: loading 1.3s infinite ease-in-out;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <img src="./icon.png" class="logo" alt="Mahdev ERP Logo">
    <h1>Mahdev ERP</h1>
    <p id="splash-status">Starting system services...</p>
    <div class="loader"><span></span></div>
    <script>
      if (window.ipcRenderer) {
        window.ipcRenderer.on('splash-progress', (event, data) => {
          const statusEl = document.getElementById('splash-status');

          let message = '';
          let type = 'status';

          if (typeof data === 'string') {
            message = data;
          } else if (data && data.message) {
            message = data.message;
            type = data.type || 'status';
          }

          statusEl.textContent = message;
          statusEl.className = type;
        });
      } else {
        console.error('ipcRenderer not available - preload.js not loaded');
        document.getElementById('splash-status').textContent = 'Error: IPC not available';
      }
    </script>
  </div>

</body>
</html>
