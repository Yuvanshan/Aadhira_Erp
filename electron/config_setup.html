<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhira ERP - Server Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5B9BD5;
            --primary-dark: #2C5F8A;
            --bg-grad-start: #C8DCF0;
            --bg-grad-end: #EEF5FC;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1E3A5F;
            --text-muted: #6B8CAE;
            --success: #4CAF50;
            --error: #E84A6F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(44, 95, 138, 0.15);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .select-input, .text-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border-radius: 12px;
            border: 1px solid rgba(44, 95, 138, 0.2);
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .select-input:focus, .text-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(91, 155, 213, 0.15);
            background: #fff;
        }

        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(44, 95, 138, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 95, 138, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-msg {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-success {
            background: rgba(76, 175, 80, 0.15);
            color: var(--success);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .status-error {
            background: rgba(232, 74, 111, 0.15);
            color: var(--error);
            border: 1px solid rgba(232, 74, 111, 0.2);
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-section">
            <h1 class="logo-title">Aadhira ERP Setup</h1>
            <p class="logo-subtitle">Configure connection mode and server URL</p>
        </div>

        <form id="setupForm" onsubmit="saveSetup(event)">
            <div class="form-group">
                <label for="mode">Connection Mode</label>
                <select id="mode" class="select-input" onchange="toggleUrlField()">
                    <option value="cloud">Cloud Mode (Online Server)</option>
                    <option value="local">Local Mode (Bundled Offline Server)</option>
                </select>
            </div>

            <div class="form-group" id="urlGroup">
                <label for="url">Cloud Server URL</label>
                <input type="url" id="url" class="text-input" placeholder="https://erp.yourdomain.com" required>
            </div>

            <button type="submit" id="submitBtn" class="btn">
                <span class="loading-spinner" id="spinner"></span>
                <span id="btnText">Save Configuration</span>
            </button>
        </form>

        <div id="status" class="status-msg"></div>
    </div>

    <script>
        function toggleUrlField() {
            const mode = document.getElementById('mode').value;
            const urlGroup = document.getElementById('urlGroup');
            const urlInput = document.getElementById('url');

            if (mode === 'local') {
                urlGroup.style.display = 'none';
                urlInput.removeAttribute('required');
            } else {
                urlGroup.style.display = 'block';
                urlInput.setAttribute('required', 'required');
            }
        }

        // Fetch current config on load
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.ipcRenderer) {
                try {
                    const config = await window.ipcRenderer.invoke('get-config');
                    if (config) {
                        document.getElementById('mode').value = config.mode || 'cloud';
                        document.getElementById('url').value = config.url && config.url !== 'https://erp.yourdomain.com' ? config.url : '';
                        toggleUrlField();
                    }
                } catch (e) {
                    console.error("Failed to load initial configuration:", e);
                }
            }
        });

        async function saveSetup(event) {
            event.preventDefault();
            
            const mode = document.getElementById('mode').value;
            let url = document.getElementById('url').value.trim();
            const statusDiv = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');

            if (mode === 'local') {
                url = 'http://127.0.0.1:8888';
            } else {
                // Remove trailing slash
                if (url.endsWith('/')) {
                    url = url.slice(0, -1);
                }
            }

            // Reset status
            statusDiv.style.display = 'none';
            statusDiv.className = 'status-msg';
            
            // Show loading
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Testing Connection...';

            if (window.ipcRenderer) {
                // IPC call to main process to save and reload
                window.ipcRenderer.send('save-config', { mode, url });
                
                // Listen for save config response status
                window.ipcRenderer.once('save-config-status', (event, response) => {
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Save Configuration';
                    
                    if (response.success) {
                        statusDiv.textContent = 'Configuration saved successfully! Redirecting...';
                        statusDiv.classList.add('status-success');
                        statusDiv.style.display = 'block';
                    } else {
                        statusDiv.textContent = 'Connection test failed: ' + (response.message || 'Server unreachable.');
                        statusDiv.classList.add('status-error');
                        statusDiv.style.display = 'block';
                    }
                });
            } else {
                // Fallback for browser tests
                setTimeout(() => {
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Save Configuration';
                    statusDiv.textContent = 'Saved locally (Demo)';
                    statusDiv.classList.add('status-success');
                    statusDiv.style.display = 'block';
                }, 1000);
            }
        }
    </script>
</body>
</html>
